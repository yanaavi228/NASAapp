<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#050b16"><meta name="description" content="COSMOLAB — живая космическая база NASA">
<title>COSMOLAB — NASA Base</title>
<style>
:root{--bg:#050a14;--panel:#0a1524;--panel2:#0e1c2f;--line:#1d3854;--text:#e9f5ff;--muted:#86a3bf;--cyan:#5fe0ff;--teal:#59efc2;--amber:#ffc46b;--red:#ff7d8e;--violet:#a795ff;--blue:#6ba9ff;--accent:var(--cyan);--shadow:0 22px 60px rgba(0,0,0,.55)}
*{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden;background:var(--bg)}
body{color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
button,input,select{font:inherit;color:inherit}button{cursor:pointer}button:disabled{cursor:not-allowed;opacity:.42}
button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#hubCanvas{position:fixed;inset:0;display:block;width:100vw;height:100vh;touch-action:none;cursor:default}
#hud{position:fixed;top:max(14px,env(safe-area-inset-top));left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:10px;z-index:200;pointer-events:none}
.hudChip{display:flex;align-items:center;gap:9px;height:48px;padding:0 16px 0 9px;border-radius:16px;background:linear-gradient(180deg,rgba(12,26,44,.92),rgba(6,15,27,.86));border:1px solid rgba(124,188,244,.28);box-shadow:0 8px 30px rgba(0,0,0,.38),inset 0 1px 0 rgba(255,255,255,.05);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);font-weight:850;font-size:19px;font-variant-numeric:tabular-nums;letter-spacing:.02em}
.hudChip span{line-height:1;padding-top:1px}
.hudChip.money{color:#ffe0a3;border-color:rgba(255,196,107,.3)}
.dayRing{position:relative;width:34px;height:34px;display:grid;place-items:center;color:var(--cyan);flex:none}
.dayRing .ring{position:absolute;inset:0;transform:rotate(-90deg)}
.dayRing .ring circle{fill:none;stroke-width:2.4}
.dayRing .ring .track{stroke:rgba(134,183,226,.18)}
.dayRing .ring .bar{stroke:var(--cyan);stroke-linecap:round;stroke-dasharray:94.25;stroke-dashoffset:94.25;transition:stroke .4s}
.hudChip.money svg{width:25px;height:25px;flex:none}
.dayRing svg.cal{width:21px;height:21px;position:relative;z-index:1}
#dayChip.night .dayRing{color:var(--violet)}#dayChip.night .dayRing .ring .bar{stroke:var(--violet)}
#toastIcon{position:fixed;left:50%;top:86px;transform:translate(-50%,0) scale(.5);z-index:210;font-size:28px;opacity:0;pointer-events:none;transition:opacity .2s,transform .3s;filter:drop-shadow(0 0 18px rgba(95,224,255,.5))}
#toastIcon.on{opacity:1;transform:translate(-50%,0) scale(1)}
#sceneNav{position:fixed;top:max(16px,env(safe-area-inset-top));right:max(16px,env(safe-area-inset-right));display:flex;gap:8px;z-index:200}
.sceneBtn{width:46px;height:46px;border-radius:50%;border:1px solid rgba(128,192,244,.3);background:rgba(8,20,36,.8);backdrop-filter:blur(12px);display:grid;place-items:center;color:#cfeeff;box-shadow:0 8px 28px rgba(0,0,0,.4);transition:.2s}
.sceneBtn:hover{background:rgba(24,56,88,.92);border-color:rgba(128,210,255,.6);transform:translateY(-1px)}
.sceneBtn svg{width:22px;height:22px}
#sceneNav[hidden]{display:none}
#flash{position:fixed;inset:0;background:#d9fbff;opacity:0;pointer-events:none;z-index:150}
#flash.go{animation:flash .8s ease-out}@keyframes flash{0%{opacity:.9}100%{opacity:0}}
#modalRoot{position:fixed;inset:0;z-index:100;display:grid;place-items:center;padding:72px 18px 18px}#modalRoot[hidden]{display:none}
#modalRoot .backdrop{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 35%,rgba(12,32,58,.55),rgba(2,6,14,.86));backdrop-filter:blur(9px);-webkit-backdrop-filter:blur(9px);animation:fadeIn .2s}
#modalCard{--accent:var(--cyan);position:relative;width:min(1080px,calc(100vw - 36px));max-height:calc(100vh - 92px);display:flex;flex-direction:column;border-radius:24px;overflow:hidden;background:linear-gradient(160deg,rgba(16,33,56,.98),rgba(5,13,25,.98) 70%);border:1px solid rgba(112,180,238,.28);box-shadow:var(--shadow),0 0 90px rgba(58,151,255,.12);animation:popIn .24s cubic-bezier(.2,.8,.25,1)}
#modalCard[data-theme="science"]{--accent:var(--teal)}#modalCard[data-theme="storage"]{--accent:var(--amber)}#modalCard[data-theme="design"]{--accent:var(--blue)}#modalCard[data-theme="event"]{--accent:var(--amber)}#modalCard[data-theme="result"]{--accent:var(--teal)}
#modalCard::before{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at 80% 0%,color-mix(in srgb,var(--accent) 12%,transparent),transparent 55%)}
.modalHead{position:relative;display:flex;align-items:center;gap:14px;padding:17px 20px;border-bottom:1px solid rgba(110,170,224,.14);background:rgba(5,12,23,.35);flex:none}
.modalIcon{width:48px;height:48px;flex:none;border-radius:15px;display:grid;place-items:center;font-size:25px;background:color-mix(in srgb,var(--accent) 12%,rgba(8,20,36,.9));border:1px solid color-mix(in srgb,var(--accent) 36%,transparent);box-shadow:0 0 26px color-mix(in srgb,var(--accent) 14%,transparent)}
.modalHead .grow{min-width:0;flex:1}.modalKicker{font-size:10px;font-weight:850;letter-spacing:.22em;text-transform:uppercase;color:var(--accent);margin-bottom:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.modalHead h2{margin:0;font-size:clamp(19px,2.1vw,26px);letter-spacing:-.03em;line-height:1.12}
.closeBtn{width:40px;height:40px;flex:none;border-radius:12px;border:1px solid rgba(120,170,218,.22);background:rgba(16,34,55,.7);color:#bfd8ee;display:grid;place-items:center;transition:.15s}
.closeBtn:hover{background:rgba(50,42,58,.9);color:#fff;border-color:rgba(255,160,175,.5)}
.closeBtn svg{width:18px;height:18px}
.modalBody{padding:18px 20px 24px;overflow:auto;overscroll-behavior:contain;position:relative;scrollbar-width:thin;scrollbar-color:#2b5277 transparent}
.modalBody::-webkit-scrollbar{width:8px}.modalBody::-webkit-scrollbar-thumb{background:#254866;border-radius:8px}
.label{font-size:10px;font-weight:850;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);margin:2px 0 8px;display:flex;align-items:center;gap:7px}
.label b{color:var(--accent);letter-spacing:0}
.stack{display:grid;gap:14px}.twoCol{display:grid;grid-template-columns:1fr 1fr;gap:14px}.threeCol{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.card{background:linear-gradient(180deg,rgba(15,33,55,.82),rgba(8,20,36,.72));border:1px solid rgba(96,156,210,.18);border-radius:16px;padding:13px}
.card.soft{background:rgba(10,24,42,.56)}
.missionGrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.missionCard{position:relative;display:flex;flex-direction:column;gap:8px;text-align:left;padding:13px;border-radius:16px;border:1px solid rgba(88,150,205,.2);background:linear-gradient(150deg,rgba(17,36,60,.88),rgba(7,17,31,.85));transition:.18s;overflow:hidden}
.missionCard:hover{border-color:rgba(105,200,255,.45);transform:translateY(-2px)}.missionCard.active{border-color:var(--accent);box-shadow:0 0 0 1px color-mix(in srgb,var(--accent) 55%,transparent),0 12px 34px rgba(0,0,0,.3)}
.missionCard .planet{width:46px;height:46px;border-radius:50%;position:relative;box-shadow:inset -9px -8px 18px rgba(0,0,0,.5),0 0 22px rgba(98,190,255,.22)}
.missionCard .planet.earth{background:radial-gradient(circle at 34% 30%,#84e8ff,#2578bd 46%,#10284a 78%)}.missionCard .planet.moon{background:radial-gradient(circle at 36% 32%,#edf2fa,#8e98a7 55%,#3b4a5f 82%)}.missionCard .planet.mars{background:radial-gradient(circle at 34% 30%,#ffc18d,#be644e 56%,#6b2e3d 85%)}
.missionCard strong{font-size:14px;line-height:1.2}.missionCard .sub{font-size:11px;color:var(--muted);line-height:1.35;min-height:29px}
.metaRow{display:flex;gap:6px;flex-wrap:wrap}.meta{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:750;color:#c9e0f3;background:rgba(6,16,30,.65);border:1px solid rgba(92,150,200,.18);border-radius:8px;padding:4px 7px}
.meta svg{width:13px;height:13px;opacity:.8}.meta.gold{color:#ffd68f}.meta.cyan{color:#9eeaff}
.segmented{display:flex;gap:5px;background:rgba(5,13,25,.65);padding:4px;border-radius:12px;border:1px solid rgba(86,140,190,.16);flex-wrap:wrap}
.segBtn{flex:1;min-width:88px;padding:8px 10px;border-radius:9px;border:0;background:transparent;color:#97b4cf;font-weight:750;font-size:12px;transition:.15s}
.segBtn.active{background:color-mix(in srgb,var(--accent) 20%,#122b46);color:#fff;box-shadow:0 0 18px color-mix(in srgb,var(--accent) 12%,transparent)}
.crewRow{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}
.crewBtn{position:relative;display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 5px;border-radius:12px;border:1px solid rgba(90,150,202,.16);background:rgba(7,18,33,.6);color:#86a3bd;font-size:10px;line-height:1.15;transition:.16s}
.crewBtn .av{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:rgba(32,60,86,.55);font-size:16px;filter:grayscale(.7);opacity:.65}
.crewBtn.active{border-color:color-mix(in srgb,var(--accent) 52%,transparent);background:color-mix(in srgb,var(--accent) 9%,rgba(8,20,36,.7));color:#e8f8ff;box-shadow:0 0 20px color-mix(in srgb,var(--accent) 10%,transparent)}
.crewBtn.active .av{filter:none;opacity:1;background:color-mix(in srgb,var(--accent) 22%,#163a58)}
.readiness{display:grid;gap:6px}
.check{display:flex;align-items:center;gap:8px;font-size:12px;color:#b9d0e4;padding:6px 9px;border-radius:9px;background:rgba(6,16,30,.46);border:1px solid rgba(92,150,200,.12)}
.check .dot{width:17px;height:17px;border-radius:50%;display:grid;place-items:center;font-size:10px;font-weight:900;flex:none;background:rgba(255,125,142,.13);color:#ff9daa;border:1px solid rgba(255,125,142,.3)}
.check.ok .dot{background:rgba(89,239,194,.13);color:#84f8d4;border-color:rgba(89,239,194,.32)}
.check .v{margin-left:auto;font-weight:800;color:#e9f7ff;white-space:nowrap}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid rgba(108,168,220,.22);border-radius:12px;background:rgba(21,46,73,.8);color:#e5f5ff;font-weight:780;font-size:13px;padding:10px 15px;transition:.16s;text-decoration:none}
.btn:hover:not(:disabled){background:rgba(33,69,104,.95);border-color:rgba(125,205,255,.4);transform:translateY(-1px)}
.btn.primary{border:0;background:linear-gradient(135deg,var(--accent),color-mix(in srgb,var(--accent) 55%,#eaffff));color:#041824;box-shadow:0 10px 28px color-mix(in srgb,var(--accent) 20%,transparent)}
.btn.primary:hover:not(:disabled){filter:brightness(1.07);transform:translateY(-1px)}
.btn.wide{width:100%;padding:13px 18px;font-size:14px}.btn.small{padding:7px 10px;font-size:11px;border-radius:9px}
.btn.ghost{background:transparent;color:#9cb6ce}.btn.danger{color:#ff9baa;border-color:rgba(255,125,142,.28);background:rgba(80,25,38,.25)}
.actionsRow{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btnIcon{width:36px;height:36px;padding:0;border-radius:10px}
.progressBar{height:8px;border-radius:8px;background:rgba(5,14,26,.85);overflow:hidden;border:1px solid rgba(86,140,190,.14)}
.progressBar span{display:block;height:100%;border-radius:8px;background:linear-gradient(90deg,color-mix(in srgb,var(--accent) 65%,#1b4e73),var(--accent));transition:width .4s}
.statGrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:rgba(6,16,30,.55);border:1px solid rgba(85,145,195,.13);border-radius:12px;padding:9px 10px}
.stat .top{display:flex;align-items:center;gap:5px;justify-content:space-between;font-size:10px;color:#86a3bd;margin-bottom:4px;white-space:nowrap}
.stat .top b{color:var(--accent);font-size:10px}.stat .v{font-size:15px;font-weight:850;letter-spacing:-.02em;margin-bottom:6px}.stat .v small{font-size:10px;color:#7f9bb6;font-weight:600}
.barMini{height:5px;border-radius:6px;background:rgba(4,12,24,.85);overflow:hidden}.barMini span{display:block;height:100%;background:var(--accent);border-radius:6px}.barMini span.bad{background:var(--red)}.barMini span.warn{background:var(--amber)}
.actionGrid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.actionBtn{display:flex;align-items:center;gap:9px;text-align:left;padding:11px 12px;border-radius:12px;border:1px solid rgba(90,150,202,.17);background:rgba(9,22,39,.62);transition:.16s}
.actionBtn:hover:not(:disabled){background:rgba(20,48,76,.9);border-color:rgba(114,202,255,.38)}
.actionBtn .ico{width:32px;height:32px;border-radius:9px;background:rgba(45,95,135,.3);display:grid;place-items:center;font-size:16px;flex:none}
.actionBtn b{display:block;font-size:13px}.actionBtn small{display:block;font-size:10.5px;color:#809cb6;margin-top:2px}
.alertCard{border:1px solid rgba(255,196,107,.38);background:linear-gradient(140deg,rgba(80,49,16,.48),rgba(26,21,18,.6));box-shadow:0 0 32px rgba(255,175,70,.09)}
.alertCard .label{color:#ffc879}
.partGrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.part{display:grid;gap:5px;padding:9px 10px;border-radius:12px;background:rgba(6,17,31,.58);border:1px solid rgba(88,148,200,.14)}
.part label{display:flex;align-items:center;gap:6px;font-size:10px;text-transform:uppercase;letter-spacing:.1em;color:#87a2bb;font-weight:800}
.part select{width:100%;border:1px solid rgba(90,150,202,.18);border-radius:8px;background:#0b1d32;color:#dff3ff;padding:7px 8px;font-size:11px;outline:none}
.part select:disabled{opacity:.7}
.rangeRow{display:flex;align-items:center;gap:12px}.rangeRow input{flex:1;accent-color:var(--accent)}.rangeVal{min-width:72px;text-align:right;font-size:13px;font-weight:850;color:var(--accent)}
.matGrid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}.mat{display:flex;align-items:center;gap:6px;padding:7px 8px;border-radius:9px;background:rgba(6,16,30,.55);border:1px solid rgba(90,150,200,.12);font-size:11px;font-weight:750}
.mat em{margin-left:auto;font-style:normal;font-size:10px;color:#90abc3}.mat.bad em{color:var(--red)}
.techGrid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}
.techCard{display:flex;flex-direction:column;gap:6px;padding:11px;border-radius:14px;background:linear-gradient(165deg,rgba(14,35,54,.72),rgba(7,18,32,.66));border:1px solid rgba(88,150,200,.16)}
.techCard .head{display:flex;align-items:center;gap:7px}.techCard .head .ic{width:29px;height:29px;border-radius:9px;display:grid;place-items:center;background:rgba(45,95,135,.26);font-size:15px;flex:none}.techCard strong{font-size:12px;line-height:1.15}.techCard p{margin:0;font-size:10px;line-height:1.4;color:#86a3bd;min-height:28px}
.pips{display:flex;gap:3px}.pip{width:14px;height:4px;border-radius:4px;background:rgba(110,155,193,.2)}.pip.on{background:var(--accent);box-shadow:0 0 8px color-mix(in srgb,var(--accent) 40%,transparent)}
.techFoot{display:flex;align-items:center;justify-content:space-between;gap:6px;margin-top:auto}.techCost{font-size:10px;font-weight:750;color:#ffd48b;white-space:nowrap}
.resGrid{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}.resCard{padding:12px;border-radius:14px;background:linear-gradient(165deg,rgba(14,35,54,.72),rgba(7,18,32,.66));border:1px solid rgba(88,150,200,.16);display:flex;flex-direction:column;gap:5px}
.resCard .top{display:flex;align-items:center;gap:7px;font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:#8ca8c1;font-weight:800}.resCard .qty{font-size:23px;font-weight:900;letter-spacing:-.04em}.resCard .qty small{font-size:10px;color:#86a3bd;font-weight:650}
.resCard .btn{width:100%;margin-top:3px}
.jobLine{display:flex;align-items:center;gap:9px;padding:8px 10px;border-radius:10px;background:rgba(6,17,31,.55);border:1px solid rgba(88,150,200,.13);font-size:11px;color:#a9c2d8}
.jobLine .barMini{flex:1}.jobLine b{color:#e6f7ff;font-size:11px;white-space:nowrap}
.missionHero{display:flex;align-items:center;gap:14px;padding:13px;border-radius:16px;background:linear-gradient(140deg,rgba(20,45,74,.75),rgba(7,18,32,.7));border:1px solid rgba(94,158,212,.2)}
.missionHero .planet{width:56px;height:56px;border-radius:50%;flex:none;box-shadow:inset -10px -9px 20px rgba(0,0,0,.5),0 0 30px rgba(95,190,255,.22)}
.missionHero .planet.earth{background:radial-gradient(circle at 34% 30%,#8ceaff,#2474ba 48%,#0e2547 82%)}.missionHero .planet.moon{background:radial-gradient(circle at 36% 32%,#eef4fb,#8e98a7 56%,#3b4a5f 84%)}.missionHero .planet.mars{background:radial-gradient(circle at 34% 30%,#ffc18d,#be644e 56%,#6b2e3d 85%)}
.missionHero .grow{flex:1;min-width:0}.missionHero h3{margin:0 0 3px;font-size:17px;letter-spacing:-.02em}.missionHero .sub{font-size:11px;color:#8da8c1}
.phaseTag{font-size:10px;font-weight:850;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);border:1px solid color-mix(in srgb,var(--accent) 35%,transparent);background:color-mix(in srgb,var(--accent) 8%,transparent);border-radius:20px;padding:5px 9px;white-space:nowrap}
.dotsLine{display:flex;align-items:center;gap:5px;flex-wrap:wrap}.dayDot{width:10px;height:10px;border-radius:50%;background:rgba(110,155,193,.18);border:1px solid rgba(110,155,193,.22)}.dayDot.on{background:var(--accent);border-color:var(--accent);box-shadow:0 0 10px color-mix(in srgb,var(--accent) 40%,transparent)}.dayDot.now{background:#fff;border-color:#fff;box-shadow:0 0 14px #fff}
.choiceGrid{display:grid;gap:9px}.choice{display:flex;gap:11px;align-items:flex-start;text-align:left;padding:13px;border-radius:14px;border:1px solid rgba(96,156,210,.2);background:rgba(9,23,41,.65);transition:.16s}
.choice:hover:not(:disabled){border-color:color-mix(in srgb,var(--accent) 55%,transparent);background:rgba(20,48,78,.9);transform:translateY(-1px)}
.choice .ic{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;font-size:18px;background:rgba(48,100,140,.26);flex:none}
.choice b{display:block;font-size:13px;margin-bottom:3px}.choice small{display:block;font-size:11px;color:#8ba7c0;line-height:1.35}
.choice .bonus{margin-left:auto;flex:none;font-size:11px;font-weight:850;color:var(--accent);background:rgba(5,15,28,.55);padding:5px 8px;border-radius:8px;border:1px solid rgba(96,156,210,.16);white-space:nowrap}
.diceBox{display:flex;align-items:center;justify-content:center;gap:18px;padding:14px;flex-wrap:wrap}
.die{width:86px;height:86px;border-radius:20px;display:grid;place-items:center;font-size:42px;font-weight:950;color:#06202e;background:linear-gradient(145deg,#eafcff,#8fe4ff);box-shadow:0 12px 36px rgba(72,206,255,.25),inset 0 -8px 16px rgba(15,69,100,.18);border:1px solid #fff;transform:rotate(-5deg)}
.die.settle{animation:dieSettle .4s cubic-bezier(.2,1.5,.4,1)}@keyframes dieSettle{0%{transform:scale(1.35) rotate(12deg)}100%{transform:scale(1) rotate(-5deg)}}
.diceMath{font-size:20px;font-weight:850;letter-spacing:.02em}.diceMath small{display:block;font-size:11px;color:#8ba7c0;font-weight:650;margin-top:4px}
.resultHero{display:flex;align-items:center;gap:18px;padding:18px;border-radius:18px;background:linear-gradient(145deg,rgba(24,58,62,.52),rgba(7,20,32,.68));border:1px solid rgba(89,239,194,.24)}
.resultHero.fail{background:linear-gradient(145deg,rgba(70,26,34,.45),rgba(18,11,18,.68));border-color:rgba(255,125,142,.24)}
.resultIcon{width:84px;height:84px;border-radius:50%;display:grid;place-items:center;font-size:40px;background:rgba(9,35,38,.65);border:1px solid rgba(89,239,194,.28);box-shadow:0 0 40px rgba(89,239,194,.12);flex:none}
.resultHero.fail .resultIcon{background:rgba(48,17,24,.55);border-color:rgba(255,125,142,.3);box-shadow:0 0 40px rgba(255,125,142,.1)}

function randomMissionEvent(){const f=current.flight;if(!f||f.over||f.event)return;const sc=SC[f.design.scenario];if(Math.random()<clamp(sc.hazard*diffVal().hazard,.08,.42))f.event={kind:'mission',type:Math.floor(Math.random()*MISSION_EVENTS.length)}}
function missionAction(action){
 const f=current.flight;if(!f||f.over||f.phase!=='mission'||f.event)return;
 const sc=SC[f.design.scenario],df=DIFF[f.design.diff]||DIFF.normal,snap=f.snapshot;
 if(action==='finish'){
  const goal=sc.goal*(df.goal||1);
  if(f.science>=goal&&f.transmitted>=sc.txGoal&&f.health>=30&&f.orbit>=25)finishFlight('Миссия завершена досрочно');
  else{f.lastNote='Досрочное завершение доступно после выполнения научной и коммуникационной целей.';renderModal()}
  return;
 }
 const capacity=f.batteryMax,efficiency=Math.max(.5,1-calculate().altitudePenalty*.15),powerPenalty=calculate().margin<0?1.2:1;
 const dayCost=Math.max(14,Math.round((snap?.consumption||calculate().consumption)*.45*powerPenalty));
 let note='';
 if(action==='observe'){

  const sci=Math.max(1,Math.round((snap?.sci||15)*efficiency*(f.health/100)*(1+.08*(current.members.length-1))));
  f.science+=sci;const data=(snap?.data||1.2)*efficiency;f.buffer+=data;f.battery-=dayCost;f.health=Math.max(0,f.health-1);

 }
 if(action==='transmit'){

  f.transmitted+=sent;f.buffer=Math.max(0,f.buffer-sent);f.battery-=Math.round(dayCost*.65);
  note=`Передача: ${nf(sent,2)} ГБ на Землю. На борту ${nf(f.buffer,2)} ГБ.`;
 }
 if(action==='charge'){
  const gain=Math.max(32,Math.round(((snap?.solar||140)-(snap?.consumption||120)*.18)*2.15));
  const before=f.battery;f.battery=Math.min(capacity,f.battery+gain);f.health=Math.min(100,f.health+1);

 }
 if(action==='correct'){

 }
 f.day++;f.lastNote=note;
 const wear=Math.max(1,Math.round(2.2+calculate().altitudePenalty*3+(f.design.diff==='hard'?1:0)));

 current.report={scenario:f.design.scenario,difficulty:f.design.diff,score:points,win:f.win,day:f.day,days:f.maxDays,science:f.science,scienceGoal:goal,transmitted:Number(f.transmitted.toFixed(2)),dataGoal:sc.txGoal,battery:Math.round(f.battery),health:Math.round(f.health),orbit:Math.round(f.orbit),fuel:Math.round(f.fuel),coordination:f.coordination,reward,reason,why,design:jsonClone(f.design)};

function resolveEvent(choiceIndex){

  if(action==='fuel'){f.fuel=Math.max(0,f.fuel-11);f.orbit=Math.min(100,f.orbit+5);note='Орбита скорректирована, топливо израсходовано. '}

 }
 f.battery=clamp(f.battery,0,f.batteryMax);f.health=clamp(f.health,0,100);f.orbit=Math.max(0,f.orbit);f.fuel=Math.max(0,f.fuel);
 f.event=null;f.lastNote=note;

function buildStatusText(){const b=current.base;if(b.built===designSignature())return'Готова';const w=workingBuild();return w?`Сборка · ещё ${Math.max(0,w.end-b.day)} дн.`:'Не построена'}
function dotsHTML(total,done){
 let s='';for(let i=0;i<total;i++)s+=`<span class="dayDot ${i<done?'on':''} ${i===done?'now':''}"></span>`;return s;
}
function statHTML(label,value,ratio,detail,ok,icon){
 const cls=ok===false?'bad':ok===true?'':'warn';
 return `<div class="stat"><div class="top"><span>${icon||''} ${label}</span><b>${ok===false?'!':ok===true?'✓':'·'}</b></div><div class="v">${value}</div><div class="barMini"><span class="${cls}" style="width:${clamp(ratio*100,0,100)}%"></span></div><div class="hintLine" style="margin-top:4px">${detail}</div></div>`;
}

    <button class="btn primary wide" data-act="launch" ${d.ok?'':'disabled'}>🚀 Запустить миссию</button>

function eventCardHTML(){
 const f=current.flight;if(!f?.event)return'';
 const ev=f.event.kind==='transit'?TRANSIT_EVENTS[f.event.type]:MISSION_EVENTS[f.event.type];
 return `<div class="card alertCard"><div class="label">⚠️ Требуется решение</div><div style="display:flex;align-items:center;gap:9px;margin-bottom:5px"><span style="font-size:22px">${ev.icon}</span><b>${esc(ev.name||ev.title)}</b></div><div class="hintLine" style="margin-bottom:9px">${esc(ev.desc)}</div><button class="btn small" data-act="openEvent">Открыть ситуацию →</button></div>`;
}
function flightConsoleHTML(f){
 const sc=SC[f.design.scenario],df=DIFF[f.design.diff]||DIFF.normal;
 const hero=`<div class="missionHero"><div class="planet ${orbClass(f.design.scenario)}"></div><div class="grow"><h3>${sc.icon} ${esc(sc.name)}</h3><div class="sub">${esc(sc.body)} · ${df.label} · ${f.phase==='transit'?'Перелёт':'Рабочая орбита'}</div></div><span class="phaseTag">${f.phase==='transit'?'В пути':'Миссия'}</span></div>`;
 if(f.phase==='transit'){
  const t=f.transit,p=t.day/Math.max(1,t.total);
  return `<div class="stack">${hero}${eventCardHTML()}
   <div class="card"><div class="label">Перелёт <b>· ${t.day} / ${t.total} дн.</b></div><div class="progressBar" style="margin-bottom:9px"><span style="width:${p*100}%"></span></div><div class="dotsLine" style="margin-bottom:10px">${dotsHTML(t.total,t.day)}</div><div class="hintLine">${f.lastNote?esc(f.lastNote):'Автоматический ход перелёта: один день на рассвете. События ждут вашего решения.'}</div></div>
   <div class="actionsRow"><button class="btn primary" data-act="openSpace">🛰️ Открыть вид перелёта</button><button class="btn" data-act="close">Вернуться в хаб</button></div>
  </div>`;
 }
 const goal=sc.goal*(df.goal||1);
 const stats=`<div class="statGrid">
  ${statHTML('Наука',`${nf(f.science)} <small>/ ${nf(goal)}</small>`,f.science/goal,'Научные единицы',f.science>=goal,'🔭')}
  ${statHTML('Передано',`${nf(f.transmitted,2)} <small>/ ${nf(sc.txGoal,2)}</small>`,f.transmitted/sc.txGoal,'ГБ на Земле',f.transmitted>=sc.txGoal,'📡')}
  ${statHTML('Батарея',`${nf(f.battery)} <small>Вт·ч</small>`,f.battery/Math.max(1,f.batteryMax),`Максимум ${nf(f.batteryMax)}`,f.battery>f.batteryMax*.2,'🔋')}
  ${statHTML('Целостность',`${nf(f.health)}<small>%</small>`,f.health/100,'Критично ниже 30%',f.health>=30,'🛡')}
  ${statHTML('Орбита',`${nf(f.orbit)}<small>%</small>`,f.orbit/100,'Критично ниже 25%',f.orbit>=25,'🧭')}
  ${statHTML('Топливо',`${nf(f.fuel)} <small>ед.</small>`,f.fuel/Math.max(1,f.snapshot?.propDelta||1),'Коррекция стоит 9',f.fuel>=9,'⛽')}
 </div>`;
 const disabled=f.event||f.over?'disabled':'';
 const canFinish=f.science>=goal&&f.transmitted>=sc.txGoal&&f.health>=30&&f.orbit>=25&&!f.event&&!f.over;
 return `<div class="stack">${hero}${eventCardHTML()}
  <div class="card"><div class="label">Состояние миссии <b>· день ${f.day} / ${f.maxDays}</b></div>${stats}<div class="hintLine" style="margin-top:9px">${esc(f.lastNote||'Выберите действие на сутки. На борту '+nf(f.buffer,2)+' ГБ неотправленных данных.')}</div></div>
  <div class="actionGrid">
   <button class="actionBtn" data-act="missionAct" data-key="observe" ${disabled}><span class="ico">🔭</span><span><b>Наблюдение</b><small>Наука и данные</small></span></button>
   <button class="actionBtn" data-act="missionAct" data-key="transmit" ${disabled}><span class="ico">📡</span><span><b>Передача</b><small>Данные на Землю</small></span></button>
   <button class="actionBtn" data-act="missionAct" data-key="charge" ${disabled}><span class="ico">☀️</span><span><b>Подзарядка</b><small>Восстановить батарею</small></span></button>
   <button class="actionBtn" data-act="missionAct" data-key="correct" ${disabled}><span class="ico">🧭</span><span><b>Коррекция</b><small>Удержать орбиту</small></span></button>
  </div>
  <div class="actionsRow"><button class="btn ${canFinish?'primary':'ghost'} small" data-act="missionAct" data-key="finish" ${canFinish?'':'disabled'}>🏁 Завершить миссию</button><span class="hintLine">${canFinish?'Цели выполнены — можно возвращаться на Землю.':'Досрочное завершение станет доступно после выполнения научной и коммуникационной целей.'}</span></div>
  <div class="actionsRow"><button class="btn ghost small" data-act="close">Свернуть пульт</button><span class="hintLine">Действие занимает один день миссии.</span></div>
 </div>`;
}
function commandHTML(){
 const f=current.flight;
 if(f&&!f.over)return flightConsoleHTML(f);
 if(f&&f.over&&current.report){
  const r=current.report;
  return `<div class="stack"><div class="card resultInline ${r.win?'':'fail'}"><div class="resultHero ${r.win?'':'fail'}" style="padding:14px"><div class="resultIcon" style="width:58px;height:58px;font-size:28px">${r.win?'🏆':'🛑'}</div><div class="grow"><h3 style="font-size:19px">${r.win?'Миссия успешна':'Цели выполнены не полностью'}</h3><p>${esc(r.reason)} · ${r.score}/100</p></div><div class="scoreRing" style="width:60px;height:60px;font-size:19px">${r.score}<small>из 100</small></div></div><div class="actionsRow" style="margin-top:11px"><button class="btn primary" data-act="openResult">Подробный отчёт</button><button class="btn" data-act="newMission">Новая миссия</button></div></div></div>`;
 }
 return launchSetupHTML();
}

 return`<div class="statGrid">
  ${statHTML('Масса',`${nf(v.mass)} <small>кг</small>`,v.mass/v.rocketCapacity,`Лимит ${nf(v.rocketCapacity)}`,v.mass<=v.rocketCapacity,'⚖️')}
  ${statHTML('Бюджет',`${nf(v.cost)} <small>млн</small>`,v.cost/v.limit,`Лимит ${nf(v.limit)}`,v.cost<=v.limit,'💰')}
  ${statHTML('Мощность',`${nf(v.solar)} <small>Вт</small>`,v.consumption/Math.max(1,v.solar),`Расход ${nf(v.consumption)}`,v.margin>=0,'☀️')}
  ${statHTML('Автономность',`${nf(v.availableBattery,1)} <small>ч</small>`,v.availableBattery/v.sc.minReserve,`Нужно ${v.sc.minReserve} ч`,v.availableBattery>=v.sc.minReserve,'🔋')}
  ${statHTML('Связь',`${nf(v.link,2)} <small>Мбит/с</small>`,v.link/v.sc.reqLink,`Нужно ${nf(v.sc.reqLink,2)}`,v.link>=v.sc.reqLink,'📡')}
  ${statHTML('Траектория',`${nf(v.p.prop.delta)} <small>ед.</small>`,v.p.prop.delta/Math.max(1,v.neededProp),`Нужно ${nf(v.neededProp)}`,v.p.prop.delta>=v.neededProp,'🧭')}
 </div>`;
}
function designHTML(){

 const opts=key=>{const o=PARTS[key].options;return Array.isArray(o)?o:o[current.scenario]};
 const parts=Object.entries(PARTS).map(([key,data])=>`<div class="part"><label>${esc(data.label)}</label><select data-part="${key}" ${locked?'disabled':''}>${opts(key).map((o,i)=>`<option value="${i}" ${i===current.parts[key]?'selected':''}>${esc(o.n)}</option>`).join('')}</select></div>`).join('');
 const mats=Object.entries(mat).map(([k,n])=>{const ok=b.stock[k]>=n;return`<span class="mat ${ok?'':'bad'}">${GOODS[k].icon} ${n} <em>${b.stock[k]}/${n}</em></span>`}).join('');
 let buildBtn='';
 if(locked)buildBtn=`<button class="btn wide" disabled>Идёт полёт</button>`;
 else if(b.built===designSignature())buildBtn=`<button class="btn wide" disabled>✅ Ракета на площадке</button>`;
 else if(working)buildBtn=`<button class="btn wide" disabled>🛠️ Сборка · до дня ${working.end}</button>`;
 else buildBtn=`<button class="btn primary wide" data-act="build">🔧 Начать сборку</button>`;
 const readyClaims=v.requirements.filter(r=>!r.ok);
 return `<div class="stack">
  <div class="missionHero"><div class="planet ${orbClass(current.scenario)}"></div><div class="grow"><h3>${sc.icon} ${esc(sc.name)}</h3><div class="sub">${esc(sc.body)} · ${DIFF[current.diff].label} · проектная смета ${nf(v.cost)} / ${nf(v.limit)} млн</div></div><span class="phaseTag">${b.built===designSignature()?'Готова':working?'Сборка':'Проект'}</span></div>

   <div class="stack">
    <div class="card"><div class="label">Орбита</div><div class="rangeRow"><input id="altRange" type="range" min="${sc.minAlt}" max="${sc.maxAlt}" step="25" value="${current.alt}" ${locked?'disabled':''}><span class="rangeVal" id="altValue">${current.alt} км</span></div><div class="hintLine" style="margin-top:5px">Идеальная высота: ${sc.ideal} км. Ниже — детальнее снимки, выше — шире обзор.</div></div>
    <div class="card"><div class="label">Конструктор аппарата <b>· 7 систем + ракета</b></div><div class="partGrid">${parts}</div></div>
   </div>
   <div class="stack">
    <div class="card" style="padding:10px"><div class="label">Ракета на площадке</div><canvas id="designPreview" width="280" height="300" style="width:100%;max-height:260px;display:block;border-radius:12px;background:linear-gradient(180deg,#071326,#0a1b30)"></canvas></div>
    <div class="card"><div class="label">Сборка <b>· ${locked?'заблокирована':b.built===designSignature()?'готова':working?'идёт':'ожидает'}</b></div><div class="matGrid" style="margin-bottom:8px">${mats}</div>${buildBtn}<div class="hintLine" style="margin-top:7px">${working?`Работа завершится в день ${working.end}.`:`Сборка занимает ${2+current.parts.rocket} дн. Материалы списываются со склада.`}</div></div>
   </div>
  </div>
  <div class="card" id="designStats"><div class="label">Инженерный баланс</div>${statBar(v)}${readyClaims.length?`<div class="hintLine" style="margin-top:8px;color:#d9a278">Ограничения: ${readyClaims.map(r=>esc(r.name)).join(' · ')}</div>`:''}</div>
 </div>`;

function updateDesignLive(){

function scienceHTML(){
 const b=current.base;
 const jobs=b.jobs.filter(j=>j.type==='research');
 const cards=Object.entries(TECH).map(([key,t])=>{
  const level=b.tech[key]||0,cost=t.cost+level*7,pending=jobs.find(j=>j.key===key);
  const max=level>=2;let label='Исследовать',disabled=max;
  if(max)label='Максимум';
  else if(pending){label=`Готово в день ${pending.end}`;disabled=true}
  else if(b.wallet<cost){label='Мало денег';disabled=true}
  const prog=pending?clamp((b.day-pending.start)/Math.max(1,pending.end-pending.start),0,1)*100:0;
  return `<div class="techCard"><div class="head"><span class="ic">${t.icon}</span><strong>${esc(t.title)}</strong></div><p>${esc(t.desc)}</p><div class="pips">${[0,1].map(i=>`<span class="pip ${i<level?'on':''}"></span>`).join('')}<span class="hintLine" style="margin-left:4px">ур. ${level}/2</span></div>${pending?`<div class="progressBar"><span style="width:${prog}%"></span></div><div class="hintLine">Ещё ${Math.max(0,pending.end-b.day)} дн.</div>`:''}<div class="techFoot"><span class="techCost">💰 ${cost} · 📅 ${t.days+level} дн.</span><button class="btn small ${max?'':'primary'}" data-act="research" data-key="${key}" ${disabled?'disabled':''}>${label}</button></div></div>`;
 }).join('');
 return `<div class="stack"><div class="actionsRow" style="justify-content:space-between"><span class="hintLine">Исследования запускаются сразу, но завершаются на рассвете через указанное число дней.</span><span class="moneyPill">💰 ${nf(b.wallet)}</span></div><div class="techGrid">${cards}</div></div>`;
}
function storageHTML(){
 const b=current.base,jobs=b.jobs.filter(j=>j.type==='order');

}

function drawNightLighting(g,t){
 const n=cycle.night;if(n<.01)return;

/* ---------- flight scene ---------- */
let spacePos=0;
function quadPoint(p0,p1,p2,t){const m=1-t;return{x:m*m*p0.x+2*m*t*p1.x+t*t*p2.x,y:m*m*p0.y+2*m*t*p1.y+t*t*p2.y}}
function quadAngle(p0,p1,p2,t){const x=2*(1-t)*(p1.x-p0.x)+2*t*(p2.x-p1.x),y=2*(1-t)*(p1.y-p0.y)+2*t*(p2.y-p1.y);return Math.atan2(y,x)}
function drawPlanet(g,x,y,r,key,t){
 const cols=key==='moon'?['#f5f8ff','#aab6c5','#4b596d']:key==='mars'?['#ffd0a3','#d57459','#6d2f3c']:['#9df4ff','#2c86c9','#112d55'];
 const glowCol=key==='moon'?'rgba(190,210,255,.16)':key==='mars'?'rgba(255,132,91,.18)':'rgba(95,205,255,.2)';
 glow(g,x,y,r*2.3,glowCol);
 const body=g.createRadialGradient(x-r*.36,y-r*.38,r*.12,x,y,r);body.addColorStop(0,cols[0]);body.addColorStop(.52,cols[1]);body.addColorStop(1,cols[2]);
 g.fillStyle=body;g.beginPath();g.arc(x,y,r,0,7);g.fill();
 g.save();g.beginPath();g.arc(x,y,r,0,7);g.clip();
 if(key==='earth'){
  g.fillStyle='rgba(83,200,157,.78)';g.beginPath();g.ellipse(x-r*.18,y-r*.12,r*.32,r*.46,-.62,0,7);g.ellipse(x+r*.28,y+r*.22,r*.24,r*.34,.6,0,7);g.ellipse(x-r*.36,y+r*.42,r*.15,r*.22,.2,0,7);g.fill();
  g.fillStyle='rgba(255,255,255,.25)';for(let i=0;i<3;i++){g.beginPath();g.ellipse(x-r*.1+i*r*.3,y-r*.4+Math.sin(i+t/5000)*r*.15,r*.28,r*.08,.2,0,7);g.fill()}
 }else if(key==='moon'){
  g.fillStyle='rgba(68,82,102,.4)';for(let i=0;i<10;i++){g.beginPath();g.arc(x+Math.cos(i*2.3)*r*.6,y+Math.sin(i*2.9)*r*.58,r*(.05+(i%3)*.025),0,7);g.fill()}
 }else{
  g.fillStyle='rgba(123,54,55,.4)';for(let i=0;i<7;i++){g.beginPath();g.ellipse(x+Math.cos(i*2.1)*r*.45,y+Math.sin(i*2.7)*r*.45,r*.22,r*.09,i,0,7);g.fill()}
  g.fillStyle='rgba(255,240,230,.55)';g.beginPath();g.ellipse(x,y-r*.8,r*.3,r*.13,0,0,7);g.ellipse(x,y+r*.82,r*.22,r*.1,0,0,7);g.fill();
 }
 const shade=g.createRadialGradient(x+r*.4,y+r*.3,r*.1,x,y,r*1.12);shade.addColorStop(0,'rgba(0,0,0,0)');shade.addColorStop(.68,'rgba(0,0,0,.08)');shade.addColorStop(1,'rgba(0,0,0,.62)');g.fillStyle=shade;g.fillRect(x-r,y-r,r*2,r*2);
 g.restore();
 // atmosphere rim
 g.strokeStyle=key==='moon'?'rgba(220,235,255,.16)':key==='mars'?'rgba(255,170,130,.2)':'rgba(130,235,255,.28)';g.lineWidth=2;g.beginPath();g.arc(x,y,r+1,0,7);g.stroke();
}
function drawSpaceShip(g,x,y,angle,t,scale=1){
 g.save();g.translate(x,y);g.rotate(angle);
 // engine trail
 const grad=g.createLinearGradient(-35,0,-90,0);grad.addColorStop(0,'rgba(95,224,255,.55)');grad.addColorStop(1,'rgba(95,224,255,0)');
 g.fillStyle=grad;g.beginPath();g.moveTo(-30,-3);g.lineTo(-92+Math.sin(t/80)*3,0);g.lineTo(-30,3);g.closePath();g.fill();
 g.fillStyle='rgba(255,196,107,.7)';g.beginPath();g.moveTo(-28,-2);g.lineTo(-52-Math.sin(t/90)*4,0);g.lineTo(-28,2);g.closePath();g.fill();
 g.scale(scale,scale);
 // solar panels
 g.fillStyle='#1c5c8f';g.strokeStyle='#7edfff';g.lineWidth=1.4;
 g.fillRect(-14,-26,26,14);g.strokeRect(-14,-26,26,14);g.fillRect(-14,12,26,14);g.strokeRect(-14,12,26,14);
 g.strokeStyle='rgba(126,223,255,.45)';g.beginPath();g.moveTo(-8,-26);g.lineTo(-8,-12);g.moveTo(0,-26);g.lineTo(0,-12);g.moveTo(-8,12);g.lineTo(-8,26);g.moveTo(0,12);g.lineTo(0,26);g.stroke();
 // body
 g.fillStyle='#e8f3fb';g.beginPath();g.moveTo(38,0);g.bezierCurveTo(26,-9,4,-11,-18,-7);g.lineTo(-25,0);g.lineTo(-18,7);g.bezierCurveTo(4,11,26,9,38,0);g.fill();g.strokeStyle='#91b6cd';g.lineWidth=1.2;g.stroke();
 g.fillStyle='#4fbfe6';g.fillRect(-9,-3,12,6);g.fillStyle='#123f66';g.beginPath();g.arc(18,-2,4,0,7);g.fill();g.fillStyle='#89ecff';g.beginPath();g.arc(19,-3,2,0,7);g.fill();
 g.restore();
}
function drawSpace(g,t,dt){
 const f=current.flight,sc=SC[f?.design.scenario||current.scenario]||SC.earth,key=f?.design.scenario||current.scenario;
 const bg=g.createLinearGradient(0,0,0,H);bg.addColorStop(0,'#030817');bg.addColorStop(.6,'#071126');bg.addColorStop(1,'#02050e');g.fillStyle=bg;g.fillRect(0,0,W,H);
 glow(g,W*.74,H*.3,Math.min(W,H)*.48,'rgba(56,110,210,.13)');glow(g,W*.18,H*.86,Math.min(W,H)*.45,'rgba(118,74,190,.09)');
 // stars
 for(const s of stars){const x=(s.x*W+t*.009*(s.r+1.2))%W,y=s.y*H*.94;const a=.22+.55*Math.abs(Math.sin(t/1800+s.p));g.globalAlpha=a;g.fillStyle=s.r>1.3?'#c8f3ff':'#b8c6df';g.beginPath();g.arc(x,y,s.r,0,7);g.fill()}
 g.globalAlpha=1;
 // faint nebula streaks
 g.save();g.globalAlpha=.08;g.strokeStyle='#60a8ff';g.lineWidth=1;for(let i=0;i<3;i++){g.beginPath();g.moveTo(0,H*(.25+i*.1));g.bezierCurveTo(W*.3,H*(.1+i*.12),W*.65,H*(.4+i*.08),W,H*(.2+i*.09));g.stroke()}g.restore();
 if(!f){
  drawPlanet(g,W*.73,H*.44,Math.min(W,H)*.18,key,t);return;
 }
 if(f.phase==='transit'){
  const t0=f.transit,total=t0.total;
  const p0={x:W*.16,y:H*.76},p1={x:W*.42,y:H*.4},p2={x:W*.7,y:H*.36};
  drawPlanet(g,W*.83,H*.34,Math.min(W,H)*.145,key,t);
  // route
  g.save();g.strokeStyle='rgba(111,203,255,.2)';g.lineWidth=1.5;g.setLineDash([4,9]);g.beginPath();g.moveTo(p0.x,p0.y);g.quadraticCurveTo(p1.x,p1.y,p2.x,p2.y);g.stroke();g.setLineDash([]);
  for(let i=0;i<total;i++){const q=quadPoint(p0,p1,p2,i/Math.max(1,total));g.fillStyle=i<t0.day?'#7ef0ff':'rgba(132,185,217,.18)';g.beginPath();g.arc(q.x,q.y,i<t0.day?3:2.2,0,7);g.fill()}
  g.restore();
  const target=clamp(t0.day/Math.max(1,total),0,1);spacePos+=(target-spacePos)*(1-Math.exp(-dt/750));
  const q=quadPoint(p0,p1,p2,spacePos),ang=quadAngle(p0,p1,p2,spacePos);
  drawSpaceShip(g,q.x,q.y,ang,t,Math.min(W,H)/760);
  if(f.event?.kind==='transit'){
   for(let i=0;i<9;i++){const a=t/900+i*2.1,rr2=Math.min(W,H)*(.1+((i*37)%40)/300);g.fillStyle='rgba(188,160,140,.65)';g.beginPath();g.ellipse(W*.68+Math.cos(a)*rr2,H*.4+Math.sin(a)*rr2*.5,7+(i%3)*3,4+(i%2)*2,a,0,7);g.fill()}
  }
 }else{
  drawPlanet(g,W*.64,H*.5,Math.min(W,H)*.22,key,t);
  const cx=W*.64,cy=H*.5,rx=Math.min(W,H)*.34,ry=Math.min(W,H)*.12;
  g.save();g.strokeStyle='rgba(117,207,255,.22)';g.lineWidth=1.5;g.setLineDash([5,10]);g.beginPath();g.ellipse(cx,cy,rx,ry,-.12,0,7);g.stroke();g.setLineDash([]);
  const a=-.12+t/9000;const sx=cx+Math.cos(a)*rx,sy=cy+Math.sin(a)*ry;
  drawSpaceShip(g,sx,sy,a+Math.PI/2,t,Math.min(W,H)/900);
  g.restore();
  // orbital scan rings
  g.strokeStyle='rgba(95,224,255,.1)';g.lineWidth=1;for(let i=1;i<3;i++){g.beginPath();g.arc(cx,cy,Math.min(W,H)*(.22+i*.04),0,7);g.stroke()}
  if(f.event){g.fillStyle=`rgba(255,125,142,${.18+.14*Math.sin(t/300)})`;g.beginPath();g.arc(W*.64,H*.5,Math.min(W,H)*.26,0,7);g.fill()}
 }
 if(f.over){g.fillStyle='rgba(0,3,10,.25)';g.fillRect(0,0,W,H)}
}
/* ---------- loop and init ---------- */
let lastFrame=performance.now();
function loop(now){
 const dt=Math.min(96,Math.max(0,now-lastFrame));lastFrame=now;clock=now;
 tickCycle(dt);
 if(scene==='hub')updateMovement(dt);
 g2d.setTransform(view.dpr,0,0,view.dpr,0,0);
 g2d.clearRect(0,0,W,H);
 if(scene==='hub'){
  drawBackdrop(g2d,now);
  g2d.save();g2d.translate(view.ox,view.oy);g2d.scale(view.scale,view.scale);drawHub(g2d,now);g2d.restore();
 }else{
  drawSpace(g2d,now,dt);
 }
 updateDayRing();
 if(now-lastHud>400){refreshHudNumbers();lastHud=now}
 if(now-lastSave>8000){save();lastSave=now}
 requestAnimationFrame(loop);
}
function sceneToWorld(e){
 const r=canvas.getBoundingClientRect();
 return{x:(e.clientX-r.left-view.ox)/view.scale,y:(e.clientY-r.top-view.oy)/view.scale};
}
function padHit(x,y){return x>1055&&y>140}
function initUI(){
 window.addEventListener('resize',resizeCanvas);
 $('navHub').onclick=()=>{closeModal();scene='hub';updateSceneNav()};
 $('navConsole').onclick=()=>openModal('command');
 document.addEventListener('click',e=>{
  const cl=e.target.closest('[data-close]');if(cl){e.preventDefault();closeModal();return}
  const act=e.target.closest('[data-act]');if(act){e.preventDefault();handleAction(act)}
 });
 $('modalBody').addEventListener('change',e=>{
  const sel=e.target.closest('[data-part]');if(!sel)return;
  if(current.flight&&!current.flight.over)return;
  const key=sel.dataset.part,val=Number(sel.value);
  if(!PARTS[key]||!Number.isInteger(val)||val===current.parts[key])return;
  current.parts[key]=val;const changed=invalidateBuild();if(changed)showToastIcon('🛠️');
  save();refreshHudNumbers();renderModal();
 });
 $('modalBody').addEventListener('input',e=>{
  if(e.target.id!=='altRange')return;
  if(current.flight&&!current.flight.over)return;
  current.alt=Number(e.target.value);updateDesignLive();save();
 });
 canvas.addEventListener('mousemove',e=>{
  if(e.pointerType&&e.pointerType!=='mouse')return;
  const p=sceneToWorld(e);
  const r=roomAt(p.x,p.y);
  hoverRoom=r;
  canvas.style.cursor=(r||padHit(p.x,p.y))?'pointer':'default';
 });
 canvas.addEventListener('mouseleave',()=>{hoverRoom=null;canvas.style.cursor='default'});
 canvas.addEventListener('click',e=>{
  if(activeModal)return;
  if(scene==='space')return;
  const p=sceneToWorld(e),x=p.x,y=p.y;
  if(padHit(x,y)){
   if(current.flight&&!current.flight.over){scene='space';updateSceneNav();showToastIcon('🛰️');return}
   if(current.base.built===designSignature()||workingBuild()){openModal('command');return}
   openModal('design');return;
  }
  const room=roomAt(x,y);
  if(room){navigateRoom(room);return}
  if(walkable(x,y))setWalkTarget(x,y);
 });
 const moveCodes=['w','a','s','d','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'];
 window.addEventListener('keydown',e=>{
  if(e.key==='Escape'){resolveEsc();return}
  if(activeModal)return;
  if(scene==='space')return;
  if(['INPUT','SELECT','TEXTAREA'].includes(document.activeElement?.tagName))return;
  if(moveCodes.includes(e.key)){e.preventDefault();moveKeys[e.key]=true;hubSprite.route=[];hubSprite.onArrival=null;return}
  if(e.key==='e'||e.key==='E'){e.preventDefault();const room=roomAt(hubSprite.x,hubSprite.y);if(room)openModal(room);return}
 });
 window.addEventListener('keyup',e=>{delete moveKeys[e.key]});
 window.addEventListener('blur',()=>{for(const k of Object.keys(moveKeys))delete moveKeys[k]});
 window.addEventListener('beforeunload',save);
}
window.__COSMOLAB__={
 get state(){return current},get cycle(){return cycle},get scene(){return scene},
 advanceDay,openModal,closeModal,selectMission,startResearch,orderSupply,startBuild,launchMission,missionAction,resolveEvent,clearForNewMission,resetGame,
 setScene(v){scene=v;updateSceneNav()}
};
resizeCanvas();initUI();refreshHudNumbers();updateDayRing();updateSceneNav();save();
requestAnimationFrame(loop);
})();
